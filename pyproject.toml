[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specter-cluster"
version = "0.1.0"
description = "Offline-first car instrument cluster: mapped-camera alerts and a passive survey log. Detection only."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["aiohttp>=3.9"]

[project.optional-dependencies]
ble = ["bleak>=0.21"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
specter-core = "specter.core:main"
specter-bridge = "specter.bridge:main"

[tool.setuptools]
packages = ["specter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
